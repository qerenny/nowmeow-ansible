---
- name: Copy Logging configuration directories
  copy:
    src: "{{ playbook_dir }}/roles/logging/files/filebeat"
    dest: /opt/infrastructure/config/
    mode: '0755'

- name: Copy Logging docker-compose file
  copy:
    src: docker-compose-logging.yml
    dest: /opt/infrastructure/docker-compose-logging.yml
    mode: '0644'

- name: Start Logging Stack
  shell: docker compose -f docker-compose-logging.yml up -d
  args:
    chdir: /opt/infrastructure
