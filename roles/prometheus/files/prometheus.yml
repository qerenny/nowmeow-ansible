global:
  scrape_interval: 15s

rule_files:
  - "alert.rules"

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'node_exporter'
    static_configs:
      - targets: ['node-exporter:9100']
    file_sd_configs:
      - files:
        - '/etc/prometheus/targets/*.json'

  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']

  - job_name: 'docker_engine'
    static_configs:
      - targets: ['host.docker.internal:9323']

