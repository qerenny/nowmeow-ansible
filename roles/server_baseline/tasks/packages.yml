- name: Full system update and upgrade
  ansible.builtin.apt:
    update_cache: true
    upgrade: full
  when: ansible_os_family == "Debian"

- name: Install common packages
  ansible.builtin.apt:
    name:
      - vim
      - git
      - curl
      - htop
      - ufw
      - git
    state: present
    update_cache: true
  when: ansible_os_family == "Debian"
