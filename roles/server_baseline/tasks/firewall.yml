- name: Configure UFW (SSH, HTTP, HTTPS)
  when: inventory_hostname in groups['initial_setup_group']
  block:
    - name: Allow SSH port
      community.general.ufw:
        rule: allow
        port: "{{ server_baseline_ssh_port }}"
        proto: tcp

    - name: Allow HTTP and HTTPS ports
      community.general.ufw:
        rule: allow
        port: "{{ item }}"
        proto: tcp
      loop:
        - 80
        - 443
        - 18181

    - name: Enable UFW and set default policies
      community.general.ufw:
        state: enabled
        policy: deny
        direction: incoming