- name: Import users tasks
  ansible.builtin.import_tasks: users.yml

- name: Import packages tasks
  ansible.builtin.import_tasks: packages.yml

- name: Import firewall tasks
  ansible.builtin.import_tasks: firewall.yml

- name: Import ssh tasks
  ansible.builtin.import_tasks: ssh.yml

- name: Import ipv6 tasks
  ansible.builtin.import_tasks: ipv6.yml

- name: Import security tasks
  ansible.builtin.import_tasks: security.yml

- name: Reboot the server and wait for it to come back
  ansible.builtin.reboot:
    msg: "Rebooting server after initial setup"
    pre_reboot_delay: 0
    post_reboot_delay: 30
    reboot_timeout: 20
  when: inventory_hostname in groups['initial_setup_group']
