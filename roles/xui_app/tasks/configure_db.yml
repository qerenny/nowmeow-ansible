---
- name: Apply Advanced Settings directly to SQLite DB
  ansible.builtin.shell: |
    sqlite3 /etc/x-ui/x-ui.db "UPDATE settings SET value = '{{ item.value }}' WHERE key = '{{ item.key }}';"
  loop:
    # 1. Настройки Веб-сервера (Панели)
    - { key: 'webListen',value: "{{ ansible_host }}" }
    - { key: 'webDomain',value: "{{ domain_name }}" }
    - { key: 'webCertFile',value: "{{ xui_app_cert_file }}" }
    - { key: 'webKeyFile',value: "{{ xui_app_key_file }}" }

    # 2. Настройки Подписки (Subscription)
    - { key: 'subEnable',value: 'true' }
    - { key: 'subPort',value: "{{ xui_app_sub_port }}" }
    - { key: 'subPath',value: "{{ xui_app_sub_path }}" }
    - { key: 'subCertFile',value: "{{ xui_app_cert_file }}" }
    - { key: 'subKeyFile',value: "{{ xui_app_key_file }}" }
    - { key: 'subShowInfo',value: 'false' }
    - { key: 'subEncrypt',value: 'false' }
    - { key: 'subUpdates',value: '1' }
  changed_when: false
  notify: Restart x-ui
