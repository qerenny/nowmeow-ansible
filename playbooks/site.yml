---
- name: Deploy High-Performance Xray Infrastructure
  hosts: main_servers
  become: true
  gather_facts: true

  vars_files:
    - "../inventory/group_vars/all.yml" 

  tasks:
    - name: Setup Certbot and SSL
      ansible.builtin.import_role:
        name: certbot_setup
      tags: [ssl, certbot]

    - name: Deploy X-UI Application
      ansible.builtin.import_role:
        name: xui_app
      tags: [app, xui]

    - name: Configure Nginx Reverse Proxy
      ansible.builtin.import_role:
        name: nginx_proxy
      tags: [nginx, proxy]

    - name: Force restart of services before migration
      ansible.builtin.meta: flush_handlers
      tags: [always]

    - name: Run Data Migration
      ansible.builtin.import_role:
        name: migration_manager
      tags: [migration, data]